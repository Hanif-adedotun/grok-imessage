# /etc/nginx/sites-available/grok.hanif.one
# certbot --nginx -d grok.hanif.one adds the 443 block and HTTP redirect.
server {
    listen 80;
    listen [::]:80;
    server_name grok.hanif.one;

    location = /api {
        return 301 /api/;
    }

    # Bridge: /api/health, /api/reply, /api/mcp -> /health, /reply, /mcp
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Streamable HTTP MCP may hold an SSE stream open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
